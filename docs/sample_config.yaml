# SC2AM configuration. See cli-and-config-contract.md for the public contract.
# Copy to ~/.sc2am/config.yaml or select with --config PATH.
# Explicit CLI options > process environment > selected YAML file > defaults.

# Paths expand ~ and environment variables; relative paths use the working directory.
download_dir: ~/Downloads/sc2am

# Optional playlist. null or an empty string disables playlist actions.
default_playlist: null

# Open the downloaded MP3 in Music. Playlist actions are independent.
open_music_app: true

# Continue processing remaining URLs after input/download failures.
continue_on_error: false

# DEBUG, INFO, WARNING, ERROR, CRITICAL (case-insensitive).
log_level: INFO

# null disables file logging. Dry runs and config show never write logs.
log_file: null

# Compatibility settings: accepted and displayed, but currently inactive.
# Music uses its active library; this value does not select a library.
music_library_path: null
# Downloaded MP3 files are always retained.
keep_downloads: true
# Metadata tagging is always attempted.
normalize_metadata: true
# Music-library duplicate detection is not implemented.
skip_existing_tracks: false
