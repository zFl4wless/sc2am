name: CI

on:
  pull_request:
  push:
    branches: [main]
    tags: ["v*"]

permissions:
  contents: read

jobs:
  runtime-dependency-audit:
    name: Runtime dependency audit
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install pip-audit
        run: python -m pip install pip-audit

      - name: Audit runtime dependencies from project metadata
        run: python -m pip_audit --strict .

  test-lint-format:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.12"]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: |
            pyproject.toml
            requirements.txt
            requirements-dev.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-dev.txt

      - name: Run tests
        run: python -m pytest

      - name: Run flake8
        run: python -m flake8 main.py sc2am tests scripts

      - name: Run mypy
        run: python -m mypy main.py sc2am

      - name: Run black check
        run: python -m black --check .

  package-smoke:
    name: Package smoke (${{ matrix.os }}, ${{ matrix.artifact }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            artifact: "*.whl"
          - os: ubuntu-latest
            artifact: "*.tar.gz"
          - os: macos-latest
            artifact: "*.whl"
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Build sdist and wheel
        run: |
          python -m pip install build
          python -m build --outdir "$RUNNER_TEMP/dist"

      - name: Verify license metadata and files
        run: python scripts/verify_package_metadata.py "$RUNNER_TEMP/dist"

      - name: Install artifact into a fresh environment
        env:
          ARTIFACT: ${{ matrix.artifact }}
        run: |
          python -m venv "$RUNNER_TEMP/package-venv"
          "$RUNNER_TEMP/package-venv/bin/python" -m pip install "$RUNNER_TEMP"/dist/$ARTIFACT
          "$RUNNER_TEMP/package-venv/bin/python" -m pip check

      - name: Smoke-test installed CLI outside the checkout
        run: |
          cd "$RUNNER_TEMP"
          "$RUNNER_TEMP/package-venv/bin/python" -I "$GITHUB_WORKSPACE/scripts/smoke_installed.py"
